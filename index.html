<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINEA R&D</title>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 30px;
      color: #5fffe0;
    }

    .container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 1400px;
    }

    img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .alarm {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-bottom: 50px solid yellow;
      position: relative;
      filter: drop-shadow(0 0 8px yellow);
    }

    .triangle::after {
      content: '!';
      position: absolute;
      top: 18px;
      left: -4px;
      font-weight: bold;
      color: black;
      font-size: 24px;
    }

    .message {
      background: rgba(0,0,0,0.8);
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid yellow;
      font-size: 1.1rem;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #5fffe0;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Prima macchina */
    #alarm1 {
      top: 42%;
      left: 12%;
    }

    /* Seconda macchina */
    #alarm2 {
      top: 42%;
      left: 45%;
    }

    /* Terza macchina */
    #alarm3 {
      top: 42%;
      left: 78%;
    }
  </style>
</head>
<body>

  <h1>LINEA R&D</h1>

  <div class="container">

    <img src="linea_arrendi_1.png" alt="Sinottico SCADA">

    <div class="alarm" id="alarm1">
      <div class="triangle"></div>
      <div class="message">allarme spooler</div>
      <button onclick="nextAlarm(1)">RESET</button>
    </div>

    <div class="alarm" id="alarm2">
      <div class="triangle"></div>
      <div class="message">allarme spark</div>
      <button onclick="nextAlarm(2)">RESET</button>
    </div>

    <div class="alarm" id="alarm3">
      <div class="triangle"></div>
      <div class="message">crash plc</div>
      <button onclick="nextAlarm(3)">RESET</button>
    </div>

  </div>

  <script>
    setTimeout(() => {
      document.getElementById('alarm1').style.display = 'flex';
    }, 5000);

    function nextAlarm(step) {
      document.getElementById('alarm' + step).style.display = 'none';

      if(step === 1) {
        document.getElementById('alarm2').style.display = 'flex';
      }

      if(step === 2) {
        document.getElementById('alarm3').style.display = 'flex';
      }

      if(step === 3) {
        setTimeout(() => {
          document.getElementById('alarm1').style.display = 'flex';
        }, 1000);
      }
    }
  </script>

</body>
</html>
